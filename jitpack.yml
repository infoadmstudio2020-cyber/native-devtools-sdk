jdk:
  - openjdk17
before_install:
  - git config --global --add safe.directory '*' || true
  - chmod +x gradlew
install:
  - ./gradlew clean :native-dev-tools-sdk:assembleRelease :native-dev-tools-sdk:publishToMavenLocal :app:assembleRelease --stacktrace || ./gradlew clean :native-dev-tools-sdk:assembleRelease :native-dev-tools-sdk:publishToMavenLocal --stacktrace
